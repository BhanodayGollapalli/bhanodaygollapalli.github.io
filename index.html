<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bhanoday Gollapalli | Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Background Image */
    .bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('') center/cover no-repeat;
      filter: brightness(40%) blur(2px);
      transform: scale(1.05);
    }

    /* Overlay */
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.9));
    }

    /* Content */
    .content {
      position: relative;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .tagline {
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: #ddd;
      margin-bottom: 10px;
    }

    .message {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 30px;
    }

    .brand {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 2px;
      opacity: 0.7;
    }

    .social {
      margin-top: 20px;
    }

    .social a {
      color: #fff;
      margin: 0 12px;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 1px;
      border-bottom: 1px solid transparent;
      transition: 0.3s;
    }

    .social a:hover {
      border-bottom: 1px solid #fff;
    }

    /* Optional subtle loader */
    .loader {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Mobile */
    @media(max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="content">
    <div>
      <h1>Coming Soon</h1>
      <div class="tagline">Crafting Visual Stories</div>
      
      <div class="loader"></div>

      <div class="message">
        Sorry for the inconvenience.<br>
        We're building a premium photography experience.
      </div>

      <div class="social">
        <a href="https://www.instagram.com/bhanodaygollapalli/">Instagram</a>
        <a href="https://wa.me/+919666355136" target="_blank">WhatsApp</a>
      </div>
    </div>
  </div>

  <div class="brand">BHANODAY GOLLAPALLI</div>

</body>
</html>
