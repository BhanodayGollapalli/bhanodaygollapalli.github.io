<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: white;
  overflow: hidden;
}

/* BACKGROUND IMAGE */
.bg {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('images/') center/cover no-repeat;
  filter: brightness(50%) blur(2px);
  transform: scale(1.05);
}

/* DARK OVERLAY */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.9));
}

/* CONTENT */
.content {
  position: relative;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  margin-bottom: 15px;
}

.tagline {
  font-size: 1.2rem;
  color: #ccc;
  margin-bottom: 10px;
}

.message {
  font-size: 1rem;
  color: #aaa;
  margin-bottom: 30px;
  line-height: 1.6;
}

/* BUTTONS */
.actions {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.actions a {
  text-decoration: none;
  color: white;
  border: 1px solid rgba(255,255,255,0.5);
  padding: 10px 18px;
  font-size: 0.9rem;
  letter-spacing: 1px;
  transition: 0.3s;
}

.actions a:hover {
  background: white;
  color: black;
}

/* FOOTER BRAND */
.brand {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  font-size: 0.9rem;
  opacity: 0.7;
}

/* ===== PREVIEW SECTION ===== */

.preview-section {
  margin-top: 50px;
}

.preview-title {
  font-size: 0.9rem;
  letter-spacing: 2px;
  color: #aaa;
  margin-bottom: 20px;
}

/* GRID */
.preview-grid {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ITEM */
.preview-item {
  position: relative;
  width: 140px;
  height: 180px;
  overflow: hidden;
  text-decoration: none;
  
}

.preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s ease;
}

/* OVERLAY */
.preview-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;

  opacity: 0;
  transition: 0.3s ease;
}

.preview-overlay span {
  font-size: 0.8rem;
  letter-spacing: 1px;
  color: white;
}

/* HOVER EFFECT */
.preview-item:hover img {
  transform: scale(1.1);
}

.preview-item:hover .preview-overlay {
  opacity: 1;
}

/* MOBILE */
@media(max-width: 600px) {
  h1 { font-size: 2.2rem; }
}


</style>

</head>

<body>
