<!---------------------------------------CONTACT------------------------------------------>

<section class="contact">

  <h1>Contact</h1>

    <form class="contact-form" action="https://formsubmit.co/bhanoday.Photography@gmail.com" method="POST">

      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New Contact from Portfolio">
      <input type="hidden" name="_template" value="table">

      <label>Name *</label>
      <input type="text" placeholder="Your Name" required>

      <label>Email *</label>
      <input type="email" placeholder="Your Email" required>

      <label>Message *</label>
      <textarea placeholder="Your Message" required></textarea>

      <button type="submit">Send</button>

    </form>

    <p id="successMsg" class="success-msg">Message sent successfully!</p>

  </div>

  <a href="https://wa.me/91XXXXXXXXXX" class="whatsapp-btn" target="_blank">
  <i class="fab fa-whatsapp"></i>
</a>

</section>
